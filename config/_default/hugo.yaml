# Configuration of Hugo

# Website name
title: 'Ehsan SadrFaridpour | Enterprise GenAI, RAG & Production ML Systems'
# Website URL
baseURL: 'https://ehsan.faridpour.com/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
permalinks:
  authors: '/author/:slug/'
disableAliases: true
outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
imaging:
  resampleFilter: "Lanczos"
  quality: 80
  anchor: "Smart"
timeout: "600000"
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  highlight:
    lineNos: false
  goldmark:
    renderer:
      unsafe: true

security:
  enableInlineScript: false
  enableUnsafeMarkup: false

sitemap:
  changefreq: 'weekly'
  priority: 0.5

############################
## CUSTOMIZATION
############################

appearance:
  mode: system
  color: blue

header:
  logo:
    text: "Ehsan SadrFaridpour"
    show_name_below_picture: false # Comment out the repeated display of the name

about:
  bio: |
    Senior Data Scientist at Moderna building reliable production AI systems across enterprise GenAI, retrieval and evaluation, cloud ML, observability, and forecasting.
  show_name: false # Additional configuration to ensure name is not displayed twice.
